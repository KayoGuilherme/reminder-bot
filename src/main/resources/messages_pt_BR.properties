usage=Oi! Eu sou seu bot de lembretes de tarefas. Me mande um áudio ou um texto dizendo o que precisa fazer, a urgência e até quando (por exemplo: "preciso enviar o relatório até as 18h, é urgente"). Eu mostro um resumo para você confirmar antes de salvar.
not-supported-yet=Ainda não é suportado.
task.voice-too-long=Esse áudio é muito longo. Por favor, envie um áudio de até {0} segundos.
task.audio-failed=Desculpe, não consegui processar esse áudio. Tente novamente em instantes.
task.no-speech=Não consegui ouvir nada compreensível nesse áudio. Tente novamente.
task.not-understood=Não consegui entender isso como uma tarefa. Reescreva dizendo o que fazer e até quando.
task.parse-failed=Desculpe, não consegui processar essa mensagem. Tente novamente em instantes.
task.deadline-missing=Não encontrei um horário para essa tarefa. Envie novamente incluindo até quando ela vale (por exemplo "até as 18h" ou "amanhã às 9h").
task.deadline-past=Esse horário já passou. Envie a tarefa novamente com um horário no futuro.
task.summary.title=Tarefa: {0}
task.summary.urgency=Urgência: {0}
task.summary.deadline=Prazo: {0}
task.summary.start=Início: {0}
task.urgency.LOW=Baixa
task.urgency.MEDIUM=Média
task.urgency.HIGH=Alta
task.urgency-assumed={0} (assumida, você não informou)
task.confirm-header=Confirme esta tarefa:
task.confirm-button=Confirmar
task.cancel-button=Cancelar
task.saved-header=Tarefa salva \u2705
task.canceled-header=Tarefa cancelada \u274c
task.draft-gone=Este pedido não está mais disponível: já foi tratado ou expirou. Envie a tarefa novamente.
task.save-failed=Desculpe, não consegui salvar a tarefa agora. Aperte Confirmar de novo em instantes.

# Lembretes, um texto por urgência e etapa (reminder.<URGENCIA>.<etapa>). Os argumentos são posicionais: {0} é o título
# da tarefa e {1} os minutos inteiros que faltam para o prazo (0 quando ele chega ou passa).
reminder.LOW.1=Oi, faltam {1,choice,0#0 minutos|1#1 minuto|1<{1} minutos} para {0}, quando você puder.
reminder.MEDIUM.1={0} vence em {1,choice,0#0 minutos|1#1 minuto|1<{1} minutos}. Hora de começar.
reminder.MEDIUM.2={0} vence em {1,choice,0#0 minutos|1#1 minuto|1<{1} minutos}. Pare o que está fazendo e termine.
reminder.HIGH.1={0} vence em {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS}. Largue tudo e faça isso agora.
reminder.HIGH.2={0} vence em {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS}. Por que você ainda não começou?! ANDA LOGO.
reminder.HIGH.3={0} vence em {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS}. AGORA. Sem desculpas. FAÇA ISSO!

# Tarefas HIGH continuam cobrando depois do prazo: overdue.1 vale para as repetições 1-3, .2 para 4-6 e .3 de 7 em
# diante (e além). Aqui {1} são os minutos inteiros de atraso. O texto final encerra as cobranças.
reminder.HIGH.overdue.1={0} está {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS} ATRASADA. Por que ainda não foi feita?! FAÇA AGORA.
reminder.HIGH.overdue.2={0} AINDA não foi feita, {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS} de ATRASO. Isso é INACEITÁVEL. PARE TUDO e TERMINE ISSO.
reminder.HIGH.overdue.3={0} está {1,choice,0#0 MINUTOS|1#1 MINUTO|1<{1} MINUTOS} ATRASADA e você CONTINUA ME IGNORANDO. FAÇA. ISSO. AGORA!!!
reminder.HIGH.final={0} está {1,choice,0#0 minutos|1#1 minuto|1<{1} minutos} atrasada e cansei de cobrar. Vou parar de lembrar você agora. Marque como feita quando finalmente fizer.

# Botões de cada lembrete e as respostas a eles.
reminder.done-button=Feito ✅
reminder.snooze-button=Adiar 10 min
reminder.done.confirmed=Feito ✅\n\n{0}
reminder.snoozed=Adiada por 10 minutos ⏰\n\n{0}\nNovo prazo: {1}
reminder.action.not-available=Desculpe, essa tarefa não está mais disponível.
reminder.action.already-done=Essa tarefa já está feita ✅
reminder.action.not-active=Essa tarefa não está mais ativa.
reminder.action.already-snoozed=Essa tarefa já foi adiada. Eu lembro você de novo em breve.
