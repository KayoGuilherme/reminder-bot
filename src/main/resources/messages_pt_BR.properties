usage=Oi! Eu sou seu bot de lembretes de tarefas. Me mande um áudio ou um texto dizendo o que precisa fazer, a urgência e até quando (por exemplo: "preciso enviar o relatório até as 18h, é urgente"). Eu mostro um resumo para você confirmar antes de salvar.
not-supported-yet=Ainda não é suportado.
task.voice-too-long=Esse áudio é muito longo. Por favor, envie um áudio de até {0} segundos.
task.audio-failed=Desculpe, não consegui processar esse áudio. Tente novamente em instantes.
task.no-speech=Não consegui ouvir nada compreensível nesse áudio. Tente novamente.
task.not-understood=Não consegui entender isso como uma tarefa. Reescreva dizendo o que fazer e até quando.
task.parse-failed=Desculpe, não consegui processar essa mensagem. Tente novamente em instantes.
task.deadline-missing=Não encontrei um horário para essa tarefa. Envie novamente incluindo até quando ela vale (por exemplo "até as 18h" ou "amanhã às 9h").
task.deadline-past=Esse horário já passou. Envie a tarefa novamente com um horário no futuro.
task.summary.title=Tarefa: {0}
task.summary.urgency=Urgência: {0}
task.summary.deadline=Prazo: {0}
task.summary.start=Início: {0}
task.urgency.LOW=Baixa
task.urgency.MEDIUM=Média
task.urgency.HIGH=Alta
task.urgency-assumed={0} (assumida, você não informou)
task.confirm-header=Confirme esta tarefa:
task.confirm-button=Confirmar
task.cancel-button=Cancelar
task.saved-header=Tarefa salva \u2705
task.canceled-header=Tarefa cancelada \u274c
task.draft-gone=Este pedido não está mais disponível: já foi tratado ou expirou. Envie a tarefa novamente.
task.save-failed=Desculpe, não consegui salvar a tarefa agora. Aperte Confirmar de novo em instantes.
