spring:
  application:
    name: bot
  messages:
    basename: messages
    # Language comes only from app.language, never from the host locale.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # Graceful shutdown: a reminder or cleanup run in progress is allowed to finish (up to this long) before exit.
  lifecycle:
    timeout-per-shutdown-phase: ${APP_SHUTDOWN_TIMEOUT:30s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${APP_SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful

# Empty defaults (no secrets) make a missing variable fail @Validated binding with the property name.
app:
  timezone: ${APP_TIMEZONE:America/Fortaleza}
  language: ${APP_LANGUAGE:en}
  telegram:
    enabled: ${APP_TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    allowed-user-id: ${TELEGRAM_ALLOWED_USER_ID:}
    connect-timeout: ${APP_TELEGRAM_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_TELEGRAM_READ_TIMEOUT:30s}
  groq:
    api-key: ${GROQ_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  stt:
    language: ${APP_STT_LANGUAGE:pt}
    model: whisper-large-v3-turbo
    base-url: https://api.groq.com/openai/v1
    connect-timeout: 5s
    read-timeout: 30s
  # Any OpenAI-compatible chat-completions provider. Defaults to Groq with the Groq key; for Gemini set
  # LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai plus LLM_MODEL and LLM_API_KEY.
  llm:
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    model: ${LLM_MODEL:openai/gpt-oss-20b}
    api-key: ${LLM_API_KEY:${GROQ_API_KEY:}}
    connect-timeout: 5s
    read-timeout: 30s
  voice:
    max-seconds: ${APP_VOICE_MAX_SECONDS:60}
  draft:
    ttl: ${APP_DRAFT_TTL:10m}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
    interval: ${APP_SCHEDULER_INTERVAL:30s}
  reminder:
    repeat-interval: ${APP_REMINDER_REPEAT_INTERVAL:2m}
    max-repeats: ${APP_REMINDER_MAX_REPEATS:10}
  retention:
    enabled: ${APP_RETENTION_ENABLED:true}
    days: ${APP_RETENTION_DAYS:30}
  resilience:
    retry-backoff: ${APP_RETRY_BACKOFF:500ms}
  shutdown:
    timeout: ${APP_SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  # cid is the correlation id of the update or scheduled run being handled; "-" outside of one.
  pattern:
    level: "%5p [%X{cid:--}]"
  level:
    root: INFO
    com.kayo.reminder: INFO
    # Spring's REST client logs whole request and response bodies at DEBUG (the voice transcript, the task text,
    # the LLM prompt). Pinned so that turning on root DEBUG can never write what the owner said to the logs.
    org.springframework.web.client: INFO
    org.springframework.http.converter: INFO
