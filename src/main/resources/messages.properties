usage=Hi! I'm your task reminder bot. Send me a voice note or a text saying what you need to do, how urgent it is and by when (for example: "send the report by 6pm, it's urgent"). I'll show you a summary to confirm before saving it. Send /tasks to see your pending tasks and mark them done or cancel them.
not-supported-yet=Not supported yet.
task.voice-too-long=That voice note is too long. Please keep it to {0} seconds or less.
task.audio-failed=Sorry, I couldn''t process that audio. Please try again in a moment.
task.no-speech=I couldn''t hear anything intelligible in that audio. Please try again.
task.not-understood=I couldn''t understand that as a task. Please rephrase it, saying what to do and by when.
task.parse-failed=Sorry, I couldn''t process that message. Please try again in a moment.
task.deadline-missing=I couldn''t find a time for this task. Please resend it including when it is due (for example "by 6pm" or "tomorrow at 9").
task.deadline-past=That time has already passed. Please resend the task with a time in the future.
task.summary.title=Task: {0}
task.summary.urgency=Urgency: {0}
task.summary.deadline=Due: {0}
task.summary.start=Start: {0}
task.urgency.LOW=Low
task.urgency.MEDIUM=Medium
task.urgency.HIGH=High
task.urgency-assumed={0} (assumed, you didn''t say)
task.confirm-header=Please confirm this task:
task.confirm-button=Confirm
task.cancel-button=Cancel
task.saved-header=Task saved \u2705
task.canceled-header=Task canceled \u274c
task.draft-gone=This request is no longer available: it was already handled or it expired. Please send the task again.
task.save-failed=Sorry, I couldn''t save the task right now. Please press Confirm again in a moment.

# Reminders, one text per urgency and stage (reminder.<URGENCY>.<stage>). Arguments are positional: {0} is the task
# title and {1} the whole minutes left to the deadline (0 once it is reached or passed).
reminder.LOW.1=Hey, {1,choice,0#0 minutes|1#1 minute|1<{1} minutes} left for {0}, whenever you''re ready.
reminder.MEDIUM.1={0} is due in {1,choice,0#0 minutes|1#1 minute|1<{1} minutes}. Time to start.
reminder.MEDIUM.2={0} is due in {1,choice,0#0 minutes|1#1 minute|1<{1} minutes}. Stop what you''re doing and finish it.
reminder.HIGH.1={0} is due in {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES}. Drop everything and do it now.
reminder.HIGH.2={0} is due in {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES}. Why aren''t you on it yet?! GET MOVING.
reminder.HIGH.3={0} is due in {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES}. NOW. No excuses. DO IT!

# HIGH tasks keep nagging after the deadline: overdue.1 is for repeats 1-3, .2 for 4-6 and .3 for 7 and above (also
# used beyond that). {1} is the whole minutes overdue here. The final text ends the nagging.
reminder.HIGH.overdue.1={0} is {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES} OVERDUE. Why isn''t it done?! DO IT NOW.
reminder.HIGH.overdue.2={0} is STILL not done, {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES} OVERDUE. This is UNACCEPTABLE. STOP EVERYTHING and FINISH IT.
reminder.HIGH.overdue.3={0} is {1,choice,0#0 MINUTES|1#1 MINUTE|1<{1} MINUTES} OVERDUE and you are STILL IGNORING ME. DO IT. RIGHT. NOW!!!
reminder.HIGH.final={0} is {1,choice,0#0 minutes|1#1 minute|1<{1} minutes} overdue and I''m done nagging. I''ll stop reminding you now. Mark it done when you finally do it.

# Buttons on every reminder and what they answer with.
reminder.done-button=Done ✅
reminder.snooze-button=Snooze 10 min
reminder.done.confirmed=Done ✅\n\n{0}
reminder.snoozed=Snoozed for 10 minutes ⏰\n\n{0}\nNew deadline: {1}
reminder.action.not-available=Sorry, that task is no longer available.
reminder.action.already-done=That task is already done ✅
reminder.action.not-active=That task is no longer active.
reminder.action.already-snoozed=That task is already snoozed. I''ll remind you again soon.

# Cancel, from the /tasks list.
tasks.canceled.confirmed=Canceled \u274c\n\n{0}
tasks.action.already-canceled=That task is already canceled.

# The /tasks list: one message per task. {0} marker, {1} urgency, {2} title; {0} on the due lines is the deadline.
tasks.empty=You have no pending tasks \uD83C\uDF89
tasks.more=\u2026and {0} more pending. Finish or cancel some, then send /tasks again to see them.
tasks.marker.LOW=\uD83D\uDFE2
tasks.marker.MEDIUM=\uD83D\uDFE1
tasks.marker.HIGH=\uD83D\uDD34
tasks.list.item={0} {1} \u00b7 {2}
tasks.list.due=Due: {0}
tasks.list.overdue=\u23F0 Overdue \u00b7 Due: {0}
tasks.done-button=Done \u2705
tasks.cancel-button=Cancel \u274c
