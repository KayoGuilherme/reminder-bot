name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests use Testcontainers (PostgreSQL); Docker is available on GitHub-hosted runners.
      - name: Build and test
        run: ./mvnw -B verify
